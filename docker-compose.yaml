# version: "3.9"
services:
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app-net

  backend:
    build: ./backend
    depends_on:
      - mongo
    environment:
      - MONGO_CONNECTION_STRING=mongodb://root:example@mongo:27017/testinglab?authSource=admin
    ports:
      - "8888:8888"
    networks:
      - app-net

  mongo:
    image: mongo:latest
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=testinglab
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  mongodata:
